<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sabor do Chef | Equipe</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#252832;font-family:system-ui,sans-serif}header{background:#a90f19;color:white;padding:18px}main{max-width:760px;margin:22px auto;padding:0 14px}.card{background:white;border:1px solid #e4e6eb;border-radius:14px;padding:18px;margin-bottom:14px}label{display:block;font-weight:750;font-size:13px;margin:12px 0 5px}input,select{width:100%;padding:12px;border:1px solid #d9dce3;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 16px;font-weight:800;background:#b5121b;color:white;margin-top:14px}.muted{font-size:13px;color:#68707d}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.hidden{display:none!important}</style></head><body><header><h1>Sabor do Chef · Equipe</h1></header><main><section class="card"><h2>Atribuir perfil de funcionário</h2><p class="muted">Primeiro crie a conta em Supabase → Authentication → Users. Depois copie o UUID da conta e atribua o perfil aqui.</p><form id="form"><label for="uid">UUID do usuário</label><input id="uid" required placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" pattern="[0-9a-fA-F-]{36}"><label for="role">Perfil</label><select id="role"><option value="DELIVERY">Entrega · pedidos de entrega e retirada</option><option value="SALON">Salão · mesas e comandas</option></select><button type="submit">Salvar perfil</button><p id="message" class="muted"></p></form></section><section class="card"><h2>Perfis cadastrados</h2><div id="list" class="muted">Carregando...</div></section></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://enakuleybfvzqurrttwl.supabase.co','sb_publishable_JnYedcVNm6Q2tao49qaYzQ_qxjelyqA');const $=id=>document.getElementById(id);
async function guard(){const {data:s}=await db.auth.getSession();if(!s.session){$('message').textContent='Entre no portal como administrador primeiro.';return false;}const {data:r,error}=await db.rpc('get_my_access_role');if(error||r!=='ADMIN'){$('message').textContent='Acesso restrito ao administrador.';return false;}return true;}
async function load(){const {data,error}=await db.from('user_roles').select('user_id,role,is_active,created_at').order('created_at',{ascending:false});if(error){$('list').textContent=error.message;return;}$('list').innerHTML=(data||[]).map(x=>'<div class="row"><div><strong>'+x.role+'</strong><div class="muted">'+x.user_id+'</div><div class="muted">'+(x.is_active?'Ativo':'Desativado')+'</div></div><button data-user="'+x.user_id+'" data-active="'+x.is_active+'">'+(x.is_active?'Desativar':'Ativar')+'</button></div>').join('')||'Nenhum funcionário cadastrado.';$('list').querySelectorAll('button').forEach(b=>b.addEventListener('click',async()=>{const {error}=await db.from('user_roles').update({is_active:b.dataset.active!=='true'}).eq('user_id',b.dataset.user);if(error)alert(error.message);else load();}));}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(!await guard())return;const {data:s}=await db.auth.getSession();const {error}=await db.from('user_roles').upsert({user_id:$('uid').value.trim(),role:$('role').value,is_active:true,created_by:s.session.user.id},{onConflict:'user_id'});$('message').textContent=error?error.message:'Perfil salvo. O funcionário já pode entrar no Portal de Funcionários.';if(!error){$('form').reset();load();}});
if(await guard())load();
</script></main></body></html>
