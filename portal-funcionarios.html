<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b5121b">
<title>Sabor do Chef | Acesso de funcionários</title>
<style>
:root{--red:#b5121b;--dark:#850d14;--bg:#f4f5f7;--text:#252832;--muted:#737985;--border:#e7e9ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{background:linear-gradient(115deg,#710b12,#b5121b 65%,#cf2931);color:#fff;padding:18px max(18px,calc((100% - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:21px;margin:0;font-weight:850}header small{opacity:.88}
main{width:min(1080px,calc(100% - 28px));margin:28px auto}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 8px 28px #2026380a;margin-bottom:16px}
.login{max-width:430px;margin:64px auto}.brand{text-align:center;color:var(--red);font-size:27px;font-weight:900;margin-bottom:20px}
h2{font-size:19px;margin:0 0 14px}label{display:block;font-size:13px;font-weight:750;margin:14px 0 6px}
input{width:100%;padding:13px;border:1px solid #dfe2e8;border-radius:10px;font:inherit}
button,.link{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font-weight:800;text-decoration:none;cursor:pointer}
.primary{background:var(--red);color:#fff}.secondary{background:#f1f2f5;color:#343944}
.full{width:100%;margin-top:18px}.muted{color:var(--muted);font-size:13px}.message{font-size:14px;margin-top:12px}.error{color:#b00020}.success{color:#16723a}
.hidden{display:none!important}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
.table-card{min-width:0}
.order-card{border:1px solid var(--border);border-radius:13px;padding:12px;background:#fff;margin:0;min-width:0}
.table-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:54px}
.table-number{font-size:30px;line-height:1;font-weight:950;letter-spacing:-1px;color:var(--red);white-space:nowrap}
.table-state{font-size:11px;padding:4px 7px}
.table-total{font-size:11px;color:var(--muted);margin-top:5px;font-weight:750}
.table-details{border-top:1px solid var(--border);margin-top:10px;padding-top:8px}
.table-details summary{cursor:pointer;color:var(--red);font-size:12px;font-weight:850;list-style:none}
.table-details summary::-webkit-details-marker{display:none}
.table-details summary:after{content:'＋';float:right}
.table-details[open] summary:after{content:'−'}
.table-details>*:not(summary){margin-top:10px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.order-card{padding:10px}.table-number{font-size:27px}.table-state{font-size:10px;padding:3px 6px}}
.order-card{border:1px solid var(--border);border-radius:13px;padding:16px;background:#fff;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.danger{background:#fff0f0;color:#a10e18}.order-card ul{padding-left:20px}.table-card{border:1px solid var(--border);border-radius:13px;padding:16px;background:#fff}
.pill{display:inline-block;border-radius:30px;padding:4px 9px;font-size:12px;font-weight:800;background:#edf7ef;color:#16723a}
.pill.closed{background:#f1f2f5;color:#626875}
.notice{padding:14px;border:1px solid #f0d99b;background:#fff9e9;border-radius:12px;margin-top:14px}
.salon-composer{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.salon-composer h3{font-size:22px;font-weight:950;color:var(--red);margin:8px 0}
.salon-categories{display:flex;gap:7px;overflow:auto;padding:3px 0 10px}
.salon-categories button{white-space:nowrap;padding:8px 11px;font-size:12px;background:#f1f2f5;color:#343944}
.salon-categories button.active{background:var(--red);color:#fff}
.salon-products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.salon-product{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;min-width:0}
.salon-product img{display:block;width:100%;height:112px;object-fit:cover;background:#f1f2f5}
.salon-product-info{padding:9px}
.salon-product-name{font-size:13px;font-weight:850;line-height:1.25;min-height:34px}
.salon-product-price{font-size:13px;font-weight:800;color:var(--red);margin:5px 0}
.salon-product .primary{width:100%;padding:8px;font-size:12px}
.salon-cart{margin-top:14px;border:1px solid #ead0d2;background:#fffafa;border-radius:12px;padding:12px}
.salon-cart-line{padding:10px 0;border-bottom:1px solid var(--border)}
.salon-cart-line:last-child{border-bottom:0}
.salon-unit{background:#fff;border:1px solid var(--border);border-radius:9px;padding:8px;margin-top:7px}
.salon-sides{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.salon-sides label{display:inline-flex;align-items:center;gap:5px;margin:0;font-size:11px;font-weight:600}
.salon-sides input{width:auto;padding:0}
.salon-cart textarea{width:100%;padding:10px;border:1px solid #dfe2e8;border-radius:9px;font:inherit;resize:vertical}
.salon-cart-count{font-weight:900;color:var(--red)}
.salon-feedback{font-size:12px;color:#16723a;min-height:18px;margin:6px 0}
@media(max-width:600px){.salon-products{grid-template-columns:repeat(2,minmax(0,1fr))}.salon-product img{height:88px}}

@media(max-width:600px){main{margin:16px auto}.card{padding:17px}.login{margin:32px auto}}

.salon-table-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.salon-table-tile{border:0;border-radius:16px;padding:16px;text-align:left;min-height:150px;color:#fff;box-shadow:0 6px 18px #20263818}
.salon-table-tile.busy{background:linear-gradient(145deg,#8f1018,#c51d27)}
.salon-table-tile.free{background:linear-gradient(145deg,#13783d,#20a45a)}
.salon-table-tile .big{font-size:36px;line-height:1;font-weight:950;display:block;margin-bottom:12px}
.salon-table-tile .meta{display:block;font-size:12px;margin-top:5px;opacity:.96}
.salon-screen-nav{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.salon-screen-nav button{flex:1}
.salon-menu-screen{padding-bottom:92px}
.salon-menu-screen .salon-categories{position:sticky;top:0;background:#fff;z-index:3;padding:10px 0}
.salon-cart-open{position:fixed;z-index:15;left:14px;right:14px;bottom:14px;width:calc(100% - 28px);box-shadow:0 8px 28px #20263835;font-size:16px}
.salon-cart-screen{padding-bottom:20px}
.salon-cart-screen .salon-cart{margin-top:12px}
.salon-cart-screen .salon-submit{position:sticky;bottom:12px;box-shadow:0 4px 18px #20263820}
.salon-product-description{font-size:11px;color:var(--muted);line-height:1.35;margin-top:4px;min-height:28px}
.salon-order-history{border:1px solid var(--border);border-radius:12px;padding:12px;margin:10px 0;background:#fff}
.salon-order-history .source{font-size:11px;font-weight:850;color:var(--red)}
.salon-table-status{font-weight:900}
@media(max-width:420px){.salon-table-tile{min-height:132px;padding:12px}.salon-table-tile .big{font-size:32px}}

</style>
</head>
<body>
<header><div><h1>Sabor do Chef</h1><small>Portal de funcionários</small></div><button id="logoutBtn" class="secondary hidden" type="button">Sair</button></header>
<main>
<section id="loginScreen" class="card login">
<div class="brand">Sabor do Chef</div>
<h2>Entrar como funcionário</h2>
<p class="muted">Use o e-mail e a senha cadastrados para sua conta de acesso.</p>
<form id="loginForm">
<label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required placeholder="Seu e-mail">
<label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required placeholder="Sua senha">
<button class="primary full" type="submit">Entrar</button>
<div id="loginMessage" class="message" aria-live="polite"></div>
<button class="secondary full" id="forgotPasswordBtn" type="button">Criar ou recuperar minha senha</button>
</form>
</section>
<section id="passwordScreen" class="card login hidden">
<div class="brand">Sabor do Chef</div>
<h2>Definir senha de acesso</h2>
<p class="muted">Crie uma senha para acessar sua área de funcionário.</p>
<form id="passwordForm">
<label for="newPassword">Nova senha</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Mínimo de 8 caracteres">
<label for="confirmPassword">Confirmar nova senha</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Repita a senha">
<button class="primary full" type="submit">Salvar senha</button>
<div id="passwordMessage" class="message" aria-live="polite"></div>
</form>
</section>
<section id="portalScreen" class="hidden">
<div class="card">
<div class="top"><div><h2 id="welcomeTitle">Área do funcionário</h2><div id="roleLabel" class="muted"></div></div><a class="link secondary" href="./painel-sabor-do-chef-com-delivery.html" id="adminLink">Painel administrativo</a></div>
<div id="roleContent"></div>
<div id="portalMessage" class="message" aria-live="polite"></div>
</div>
</section>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://enakuleybfvzqurrttwl.supabase.co','sb_publishable_JnYedcVNm6Q2tao49qaYzQ_qxjelyqA');
const $=id=>document.getElementById(id);
const salonCarts=new Map();
let activeSalonTableId=null;
let salonRealtimeChannel=null;
const money=c=>(Number(c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const normalizeText=v=>String(v||'').toLowerCase().trim();
function isQuentinha(p){return normalizeText(p.category_name||'').includes('quentinha')}
function salonCartFor(tabId){if(!salonCarts.has(tabId))salonCarts.set(tabId,{items:new Map(),category:'all',notes:''});return salonCarts.get(tabId)}
function renderSalonProducts(root,cart,products,categories){
 const grid=root.querySelector('.salon-products');if(!grid)return;
 const visible=products.filter(p=>cart.category==='all'||p.category_id===cart.category);
 grid.innerHTML=visible.map(p=>'<article class="salon-product">'+(p.photo_url?'<img loading="lazy" src="'+safe(p.photo_url)+'" alt="'+safe(p.name)+'">':'<div style="height:88px;background:#f1f2f5"></div>')+'<div class="salon-product-info"><div class="salon-product-name">'+safe(p.name)+'</div><div class="salon-product-description">'+safe(p.description||'')+'</div><div class="salon-product-price">'+money(p.price_cents)+'</div><button class="primary salon-product-add" data-product="'+p.id+'">Adicionar +</button></div></article>').join('')||'<p class="muted">Nenhum produto disponível nesta categoria.</p>';
 root.querySelectorAll('.salon-categories button').forEach(b=>b.classList.toggle('active',b.dataset.category===cart.category));
}
function renderSalonCart(root,tabId,cart,products,accompByProduct){
 const box=root.querySelector('.salon-cart');if(!box)return;
 const count=[...cart.items.values()].reduce((n,x)=>n+x.units.length,0);
 const lines=[...cart.items.values()].map(item=>{
  const sideOptions=accompByProduct.get(item.product.id)||[];
  const units=item.units.map((chosen,index)=>isQuentinha(item.product)?'<div class="salon-unit"><strong>Quentinha '+(index+1)+'</strong><div class="salon-sides">'+(sideOptions.map(a=>'<label><input type="checkbox" data-side-product="'+item.product.id+'" data-unit="'+index+'" data-side="'+safe(a.name)+'" '+(chosen.includes(a.name)?'checked':'')+' '+(chosen.length>=2&&!chosen.includes(a.name)?'disabled':'')+'> '+safe(a.name)+'</label>').join('')||'<span class="muted">Sem acompanhamentos ativos.</span>')+'</div><small class="muted">'+chosen.length+'/2 acompanhamentos</small></div>':'').join('');
  return '<div class="salon-cart-line"><div class="top"><strong>'+safe(item.product.name)+'</strong><strong>'+item.units.length+' × '+money(item.product.price_cents)+'</strong></div><div class="actions"><button class="secondary salon-cart-adjust" data-product="'+item.product.id+'" data-delta="-1">−</button><button class="secondary salon-cart-adjust" data-product="'+item.product.id+'" data-delta="1">+</button><button class="danger salon-cart-remove" data-product="'+item.product.id+'">Remover</button></div>'+units+'<label>Observação deste item</label><input class="salon-item-note" data-product="'+item.product.id+'" maxlength="200" value="'+safe(item.notes||'')+'" placeholder="Ex.: sem cebola"></div>';
 }).join('');
 const total=[...cart.items.values()].reduce((sum,item)=>sum+item.product.price_cents*item.units.length,0);
 box.innerHTML='<div class="top"><strong>Revisar pedido <span class="salon-cart-count">('+count+' item(ns))</span></strong><strong>'+money(total)+'</strong></div>'+(lines||'<p class="muted">Adicione produtos para montar o pedido.</p>')+'<label>Observação geral do pedido</label><textarea class="salon-cart-notes" rows="2" maxlength="300" placeholder="Observação para a cozinha">'+safe(cart.notes)+'</textarea><div class="salon-feedback" aria-live="polite">'+safe(root.dataset.feedback||'')+'</div><button class="primary full salon-submit" '+(!count?'disabled':'')+'>CONFIRMAR PEDIDO PARA ESTA MESA</button>';
 const opener=root.querySelector('.salon-cart-open');
 if(opener){opener.classList.toggle('hidden',count===0);opener.textContent='Carrinho · '+count+' item(ns) · '+money(total);}
}
function bindSalonComposer(root,tabId,products,categories,accompByProduct){
 const cart=salonCartFor(tabId);
 const productMap=new Map(products.map(p=>[p.id,p]));
 root.querySelector('.salon-categories')?.addEventListener('click',e=>{
  const b=e.target.closest('button[data-category]');if(!b)return;cart.category=b.dataset.category;renderSalonProducts(root,cart,products,categories);
 });
 root.querySelector('.salon-products')?.addEventListener('click',e=>{
  const b=e.target.closest('.salon-product-add');if(!b)return;
  const product=productMap.get(b.dataset.product);if(!product)return;
  const already=cart.items.get(product.id)?.units.length||0;
  if(already>=Number(product.stock_quantity||0)){alert('Limite de estoque atingido para este produto.');return;}
  if(!cart.items.has(product.id))cart.items.set(product.id,{product,units:[],notes:''});
  cart.items.get(product.id).units.push([]);
  root.dataset.feedback=product.name+' adicionado ao carrinho.';
  renderSalonCart(root,tabId,cart,products,accompByProduct);
 });
 root.querySelector('.salon-cart-open')?.addEventListener('click',()=>{
  root.querySelector('.salon-menu-screen')?.classList.add('hidden');
  root.querySelector('.salon-cart-screen')?.classList.remove('hidden');
 });
 root.querySelector('.salon-cart-back')?.addEventListener('click',()=>{
  root.querySelector('.salon-cart-screen')?.classList.add('hidden');
  root.querySelector('.salon-menu-screen')?.classList.remove('hidden');
 });
 root.querySelector('.salon-cart')?.addEventListener('click',async e=>{
  const adjust=e.target.closest('.salon-cart-adjust'),remove=e.target.closest('.salon-cart-remove');
  if(adjust){const item=cart.items.get(adjust.dataset.product);if(!item)return;const delta=Number(adjust.dataset.delta);if(delta>0){if(item.units.length>=Number(item.product.stock_quantity||0)){alert('Limite de estoque atingido para este produto.');return;}item.units.push([]);}else item.units.pop();if(!item.units.length)cart.items.delete(adjust.dataset.product);renderSalonCart(root,tabId,cart,products,accompByProduct);return;}
  if(remove){cart.items.delete(remove.dataset.product);renderSalonCart(root,tabId,cart,products,accompByProduct);return;}
  if(e.target.closest('.salon-submit')){
   const count=[...cart.items.values()].reduce((n,x)=>n+x.units.length,0);if(!count)return;
   const btn=e.target.closest('.salon-submit');btn.disabled=true;btn.textContent='Enviando pedido...';
   const payload=[...cart.items.values()].map(x=>({product_id:x.product.id,quantity:x.units.length,notes:x.notes||'',accompaniments_by_unit:isQuentinha(x.product)?x.units:x.units.map(()=>[])}));
   const {data,error}=await supabase.rpc('create_salon_order',{p_tab_id:tabId,p_items:payload,p_customer_notes:cart.notes});
   if(error){alert(error.message);btn.disabled=false;btn.textContent='CONFIRMAR PEDIDO PARA ESTA MESA';return;}
   salonCarts.delete(tabId);
   root.querySelector('.salon-menu-screen')?.classList.add('hidden');
   root.querySelector('.salon-cart-screen')?.classList.add('hidden');
   const success=root.querySelector('.salon-success-screen');
   success?.classList.remove('hidden');
   if(success){
    success.querySelector('.salon-success-text').textContent='Pedido #'+data.order_number+' · Mesa '+root.dataset.tableNumber+' · Total '+money(data.total_cents)+'. O pedido já foi registrado e enviado para a fila de impressão.';
    success.querySelector('.salon-success-menu').addEventListener('click',()=>loadSalonOverview(root.dataset.tableId),{once:true});
    success.querySelector('.salon-success-tab').addEventListener('click',async()=>{await loadSalonOverview(root.dataset.tableId);$('salonShowTab')?.click();},{once:true});
   }
  }
 });
 root.querySelector('.salon-cart')?.addEventListener('change',e=>{
  const side=e.target.closest('input[data-side-product]');
  if(side){const item=cart.items.get(side.dataset.sideProduct);if(!item)return;const unit=item.units[Number(side.dataset.unit)];if(!unit)return;
   if(side.checked){if(unit.length>=2){side.checked=false;alert('Escolha no máximo 2 acompanhamentos por quentinha.');return;}unit.push(side.dataset.side);}
   else{const i=unit.indexOf(side.dataset.side);if(i>=0)unit.splice(i,1);}
   renderSalonCart(root,tabId,cart,products,accompByProduct);return;
  }
  const note=e.target.closest('.salon-item-note');if(note){const item=cart.items.get(note.dataset.product);if(item)item.notes=note.value;return;}
  if(e.target.matches('.salon-cart-notes'))cart.notes=e.target.value;
 });
 root.querySelector('.salon-cart')?.addEventListener('input',e=>{
  if(e.target.matches('.salon-item-note')){const item=cart.items.get(e.target.dataset.product);if(item)item.notes=e.target.value;}
  if(e.target.matches('.salon-cart-notes'))cart.notes=e.target.value;
 });
 renderSalonProducts(root,cart,products,categories);
 renderSalonCart(root,tabId,cart,products,accompByProduct);
}
function message(id,text,type=''){const el=$(id);el.textContent=text;el.className='message '+type}
function showLogin(){ $('loginScreen').classList.remove('hidden');$('passwordScreen').classList.add('hidden');$('portalScreen').classList.add('hidden');$('logoutBtn').classList.add('hidden'); }
function showPassword(){ $('loginScreen').classList.add('hidden');$('portalScreen').classList.add('hidden');$('passwordScreen').classList.remove('hidden');$('logoutBtn').classList.add('hidden'); }
function showPortal(){ $('loginScreen').classList.add('hidden');$('portalScreen').classList.remove('hidden');$('logoutBtn').classList.remove('hidden'); }
function safe(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadSalonOverview(selectedTableId=null){
  activeSalonTableId=selectedTableId;
  $('roleContent').innerHTML='<p class="muted">Carregando mesas e comandas...</p>';
  const [tr,tabr,pr,cr,ar]=await Promise.all([
    supabase.from('restaurant_tables').select('id,table_number,active').order('table_number'),
    supabase.from('dining_tabs').select('id,table_id,status,opened_at').eq('status','OPEN'),
    supabase.from('products').select('id,name,description,price_cents,stock_quantity,photo_url,category_id').eq('active',true).gt('stock_quantity',0).order('name'),
    supabase.from('categories').select('id,name,sort_order').eq('active',true).order('sort_order'),
    supabase.from('product_accompaniments').select('id,product_id,name,sort_order').eq('active',true).order('sort_order')
  ]);
  if(tr.error)throw tr.error;if(tabr.error)throw tabr.error;if(pr.error)throw pr.error;if(cr.error)throw cr.error;if(ar.error)throw ar.error;
  const tables=(tr.data||[]).slice().sort((a,b)=>Number(a.table_number)-Number(b.table_number));
  const tabs=tabr.data||[],products=pr.data||[],categories=cr.data||[],accompaniments=ar.data||[];
  const categoryById=new Map(categories.map(c=>[c.id,c.name]));
  products.forEach(p=>p.category_name=categoryById.get(p.category_id)||'');
  const accompByProduct=new Map();
  accompaniments.forEach(a=>{if(!accompByProduct.has(a.product_id))accompByProduct.set(a.product_id,[]);accompByProduct.get(a.product_id).push(a)});
  const tabIds=tabs.map(t=>t.id);
  let orders=[];
  if(tabIds.length){
    const or=await supabase.from('orders').select('id,order_number,dining_tab_id,total_cents,created_at,customer_notes,status,cancellation_reason,order_source,order_items(id,product_name_snapshot,unit_price_cents,quantity,notes,order_item_accompaniments(accompaniment_name,unit_index))').in('dining_tab_id',tabIds).order('created_at',{ascending:true});
    if(or.error)throw or.error;orders=or.data||[];
  }
  const openByTable=new Map(tabs.map(t=>[t.table_id,t]));
  const ordersByTab=new Map();
  orders.forEach(o=>{if(!ordersByTab.has(o.dining_tab_id))ordersByTab.set(o.dining_tab_id,[]);ordersByTab.get(o.dining_tab_id).push(o)});
  if(!salonRealtimeChannel){
    salonRealtimeChannel=supabase.channel('salon-staff-live')
      .on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>{if($('roleContent')?.dataset?.salonMode==='true')loadSalonOverview(activeSalonTableId).catch(e=>message('portalMessage',e.message||'Falha ao atualizar salão.','error'));})
      .on('postgres_changes',{event:'*',schema:'public',table:'dining_tabs'},()=>{if($('roleContent')?.dataset?.salonMode==='true')loadSalonOverview(activeSalonTableId).catch(e=>message('portalMessage',e.message||'Falha ao atualizar salão.','error'));})
      .subscribe();
  }
  $('roleContent').dataset.salonMode='true';
  const historyHtml=(tabOrders)=>tabOrders.map(o=>{
    const origin=o.order_source==='CLIENT_QR'?'CLIENTE · QR CODE':'FUNCIONÁRIO';
    const items=(o.order_items||[]).map(i=>{
      const sides=(i.order_item_accompaniments||[]).map(a=>'<div class="muted">Unidade '+safe(Number(a.unit_index)+1)+': '+safe(a.accompaniment_name)+'</div>').join('');
      return '<li>'+safe(i.quantity)+'x '+safe(i.product_name_snapshot)+' — '+money(i.unit_price_cents*i.quantity)+(i.notes?' · '+safe(i.notes):'')+sides+'</li>';
    }).join('');
    return '<article class="salon-order-history"><div class="top"><strong>Pedido #'+safe(o.order_number)+'</strong><span class="pill '+(o.status==='CANCELADO'?'closed':'')+'">'+safe(o.status)+'</span></div><div class="source">'+origin+'</div><ul>'+items+'</ul>'+(o.customer_notes?'<p class="muted">Obs.: '+safe(o.customer_notes)+'</p>':'')+(o.cancellation_reason?'<p class="muted">Motivo: '+safe(o.cancellation_reason)+'</p>':'')+'<small class="muted">'+new Date(o.created_at).toLocaleString('pt-BR')+'</small></article>';
  }).join('')||'<p class="muted">Ainda não há pedidos nesta comanda.</p>';
  if(selectedTableId){
    const table=tables.find(t=>t.id===selectedTableId);
    const tab=table?openByTable.get(table.id):null;
    if(!table||!tab){activeSalonTableId=null;return loadSalonOverview();}
    const tabOrders=ordersByTab.get(tab.id)||[];
    const total=tabOrders.filter(o=>o.status!=='CANCELADO').reduce((sum,o)=>sum+Number(o.total_cents||0),0);
    const rootId='salonComposer_'+tab.id.replace(/-/g,'');
    const categoryButtons='<button type="button" class="active" data-category="all">Todas</button>'+categories.map(c=>'<button type="button" data-category="'+c.id+'">'+safe(c.name)+'</button>').join('');
    $('roleContent').innerHTML=
      '<div class="salon-screen-nav"><button type="button" class="secondary" id="salonBackTables">← Todas as mesas</button><button type="button" class="secondary" id="salonShowTab">Ver comanda · '+money(total)+'</button></div>'+
      '<div id="'+rootId+'" data-salon-composer="'+tab.id+'" data-table-id="'+table.id+'" data-table-number="'+safe(table.table_number)+'">'+
      '<section class="card salon-menu-screen" id="salonMenuScreen"><h2>Cardápio · Mesa '+safe(table.table_number)+'</h2><p class="muted">Escolha os produtos como no cardápio do cliente. O pedido será adicionado diretamente à comanda aberta.</p>'+
      '<div class="salon-categories">'+categoryButtons+'</div><div class="salon-products"></div></section>'+
      '<section class="card salon-cart-screen hidden" id="salonCartScreen"><div class="salon-screen-nav"><button type="button" class="secondary salon-cart-back">← Voltar ao cardápio</button><strong>Mesa '+safe(table.table_number)+'</strong></div><div class="salon-cart"></div></section>'+
      '<section class="card hidden salon-success-screen" id="salonSuccessScreen"><h2>Pedido adicionado à comanda!</h2><p class="salon-success-text"></p><button type="button" class="primary full salon-success-menu">Continuar no cardápio</button><button type="button" class="secondary full salon-success-tab">Ver comanda atualizada</button></section>'+
      '<section class="card hidden" id="salonTabScreen"><div class="salon-screen-nav"><button type="button" class="secondary" id="salonTabBack">← Voltar ao cardápio</button><strong>Comanda · Mesa '+safe(table.table_number)+'</strong></div><div class="top"><strong>Total acumulado</strong><strong>'+money(total)+'</strong></div>'+historyHtml(tabOrders)+'<label>Forma de pagamento na saída</label><select id="salonPayment"><option value="DINHEIRO">Dinheiro</option><option value="PIX">Pix</option><option value="CARTAO">Cartão</option></select><button class="danger full" id="salonCloseTab">Fechar conta e liberar mesa</button></section>'+
      '<button type="button" class="primary salon-cart-open hidden">Carrinho</button></div>';
    const root=$(rootId);
    bindSalonComposer(root,tab.id,products,categories,accompByProduct);
    $('salonBackTables').addEventListener('click',()=>loadSalonOverview());
    $('salonShowTab').addEventListener('click',()=>{$('salonMenuScreen').classList.add('hidden');$('salonCartScreen').classList.add('hidden');$('salonTabScreen').classList.remove('hidden');$('roleContent').querySelector('.salon-cart-open')?.classList.add('hidden');});
    $('salonTabBack').addEventListener('click',()=>{
      $('salonTabScreen').classList.add('hidden');$('salonMenuScreen').classList.remove('hidden');
      const currentCart=salonCartFor(tab.id);
      const itemCount=[...currentCart.items.values()].reduce((n,item)=>n+item.units.length,0);
      $('roleContent').querySelector('.salon-cart-open')?.classList.toggle('hidden',itemCount===0);
    });
    $('salonCloseTab').addEventListener('click',async()=>{
      const payment=$('salonPayment').value;
      if(!confirm('Confirma o recebimento em '+payment+' e o fechamento da conta da Mesa '+table.table_number+'?'))return;
      const btn=$('salonCloseTab');btn.disabled=true;
      const {data,error}=await supabase.rpc('close_dining_tab_with_payment',{p_tab_id:tab.id,p_payment_method:payment,p_closing_note:null});
      if(error){alert(error.message);btn.disabled=false;return;}
      alert('Mesa '+table.table_number+' fechada. Total recebido: '+money(data.total_cents)+'. Comprovante enviado à fila da impressora.');
      activeSalonTableId=null;await loadSalonOverview();
    });
    const cartOpen=$('roleContent').querySelector('.salon-cart-open');
    cartOpen.addEventListener('click',()=>{$('salonMenuScreen').classList.add('hidden');$('salonCartScreen').classList.remove('hidden');});
    return;
  }
  const cards=tables.map(t=>{
    const tab=openByTable.get(t.id),tabOrders=tab?(ordersByTab.get(tab.id)||[]):[];
    const total=tabOrders.filter(o=>o.status!=='CANCELADO').reduce((sum,o)=>sum+Number(o.total_cents||0),0);
    const qrNew=tabOrders.filter(o=>o.order_source==='CLIENT_QR'&&['APROVADO','ENVIADO_IMPRESSAO','FALHA_IMPRESSAO'].includes(o.status)).length;
    const status=tab?'EM USO':'LIVRE';
    return '<button type="button" class="salon-table-tile '+(tab?'busy':'free')+'" data-table="'+t.id+'"><span class="big">MESA '+safe(t.table_number)+'</span><span class="table-state">'+status+'</span>'+
      (tab?'<span class="meta">Comanda: '+money(total)+'</span><span class="meta">'+tabOrders.length+' pedido(s)'+(qrNew?' · '+qrNew+' novo(s) via QR Code':'')+'</span>':'<span class="meta">Disponível para receber clientes</span>')+
      '<span class="meta">'+(tab?'Toque para abrir a mesa':'Toque para abrir comanda')+'</span></button>';
  }).join('');
  $('roleContent').innerHTML='<div class="top"><div><h2>Salão · 10 mesas</h2><p class="muted">Mesas em ordem numérica · Vermelho: em uso · Verde: livre</p></div><button class="secondary" id="refreshSalon">Atualizar</button></div><div class="salon-table-grid">'+(cards||'<p class="muted">Nenhuma mesa cadastrada.</p>')+'</div>';
  $('refreshSalon').addEventListener('click',()=>loadSalonOverview());
  $('roleContent').querySelectorAll('[data-table]').forEach(btn=>btn.addEventListener('click',async()=>{
    const table=tables.find(t=>t.id===btn.dataset.table);if(!table)return;
    const tab=openByTable.get(table.id);
    if(tab){await loadSalonOverview(table.id);return;}
    if(!table.active){alert('Esta mesa está inativa.');return;}
    btn.disabled=true;
    const {error}=await supabase.rpc('open_dining_tab',{p_table_id:table.id});
    if(error){alert(error.message);btn.disabled=false;return;}
    await loadSalonOverview();
  }));
}
async function loadDeliveryOrders(){
  const {data:orders,error}=await supabase.from('orders')
    .select('id,order_number,order_type,status,customer_name,customer_phone,delivery_address,payment_method,total_cents,needs_change,change_for_cents,customer_notes,cancellation_reason,created_at,order_items(id,product_name_snapshot,unit_price_cents,quantity,notes)')
    .in('order_type',['DELIVERY','PICKUP']).order('created_at',{ascending:false}).limit(60);
  if(error) throw error;
  const money=c=>((Number(c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}));
  const cards=(orders||[]).map(o=>{
    const items=(o.order_items||[]).map(i=>'<li>'+safe(i.quantity)+'x '+safe(i.product_name_snapshot)+' — '+money(i.unit_price_cents*i.quantity)+(i.notes?'<br><small>'+safe(i.notes)+'</small>':'')+'</li>').join('');
    const pending=['RECEBIDO','AGUARDANDO_APROVACAO'].includes(o.status);
    const approved=['APROVADO','ENVIADO_IMPRESSAO','IMPRESSO','FALHA_IMPRESSAO'].includes(o.status);
    const buttons=pending?'<button class="primary" data-action="APPROVE" data-id="'+o.id+'">Aceitar pedido</button><button class="danger" data-action="REJECT" data-id="'+o.id+'">Recusar</button>':approved?'<button class="primary" data-action="DELIVER" data-id="'+o.id+'">Marcar como entregue</button>':'';
    return '<article class="order-card"><div class="top"><strong>Pedido #'+safe(o.order_number)+' · '+(o.order_type==='PICKUP'?'Retirada':'Entrega')+'</strong><span class="pill '+(o.status==='CANCELADO'?'closed':'')+'">'+safe(o.status)+'</span></div><p><strong>'+safe(o.customer_name||'Cliente')+'</strong> · '+safe(o.customer_phone||'')+'</p><p class="muted">'+safe(o.delivery_address||'Retirada no local')+'</p><ul>'+items+'</ul><p><strong>Total: '+money(o.total_cents)+'</strong></p>'+(o.needs_change?'<p>Troco para: '+money(o.change_for_cents)+'</p>':'')+(o.customer_notes?'<p>Observação: '+safe(o.customer_notes)+'</p>':'')+(o.cancellation_reason?'<p>Motivo: '+safe(o.cancellation_reason)+'</p>':'')+'<p class="muted">'+new Date(o.created_at).toLocaleString('pt-BR')+'</p><div class="actions">'+buttons+'</div></article>';
  }).join('');
  $('roleContent').innerHTML='<div class="top"><h2>Pedidos de entrega e retirada</h2><button class="secondary" id="refreshDelivery">Atualizar</button></div><p class="muted">Esta conta só visualiza pedidos de entrega/retirada e executa as ações permitidas. Produtos, preços, salão e configurações não ficam disponíveis.</p>'+(cards||'<p class="muted">Nenhum pedido encontrado.</p>');
  $('refreshDelivery').addEventListener('click',loadDeliveryOrders);
  $('roleContent').querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',async()=>{
    const action=btn.dataset.action;let reason=null;
    if(action==='REJECT'){reason=window.prompt('Informe o motivo da recusa:');if(reason===null)return;if(reason.trim().length<3){alert('Informe um motivo com pelo menos 3 caracteres.');return;}}
    btn.disabled=true;
    const {error}=await supabase.rpc('set_delivery_order_action',{p_order_id:btn.dataset.id,p_action:action,p_reason:reason});
    if(error){alert(error.message);btn.disabled=false;return;}
    await loadDeliveryOrders();
  }));
}

async function startSession(user){
  try{
    const {data:role,error}=await supabase.rpc('get_my_access_role');
    if(error) throw error;
    if(!role) throw new Error('Esta conta ainda não possui um perfil de acesso ativo. Peça ao administrador para atribuir o perfil.');
    showPortal();
    $('welcomeTitle').textContent='Bem-vindo(a)';
    $('roleLabel').textContent='Perfil identificado: '+role;
    $('adminLink').classList.toggle('hidden',role!=='ADMIN');
    if(role==='ADMIN'){
      $('roleContent').innerHTML='<p>Seu perfil é de administrador. Use os atalhos abaixo para preparar os testes do salão.</p><p><a class="link primary" href="./painel-sabor-do-chef-com-delivery.html">Painel administrativo</a></p><p><a class="link secondary" href="./equipe-salao.html">Gerenciar perfis de funcionários</a></p><p><a class="link secondary" href="./qrs-salao.html">Gerar e imprimir QR Codes das mesas</a></p>';
    }else if(role==='SALON'){
      await loadSalonOverview();
    }else if(role==='DELIVERY'){
      await loadDeliveryOrders();
    }else{
      throw new Error('Perfil não reconhecido. Acesso bloqueado.');
    }
  }catch(e){await supabase.auth.signOut();showLogin();message('loginMessage',e.message||'Não foi possível validar o acesso.','error')}
}
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();message('loginMessage','Validando conta...');
 const {data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 if(error){message('loginMessage','Não foi possível entrar: '+error.message,'error');return}
 await startSession(data.user);
});
$('forgotPasswordBtn').addEventListener('click',async()=>{
 const email=$('email').value.trim();
 if(!email){message('loginMessage','Informe seu e-mail primeiro.','error');return;}
 message('loginMessage','Enviando link para criar/recuperar a senha...');
 const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:'https://cardapiosabordochef.com.br/portal-funcionarios.html'});
 if(error){message('loginMessage','Não foi possível enviar: '+error.message,'error');return;}
 message('loginMessage','Enviamos um link para '+email+'. Abra o e-mail neste celular para definir sua senha.','success');
});
$('passwordForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const a=$('newPassword').value,b=$('confirmPassword').value;
 if(a.length<8){message('passwordMessage','A senha precisa ter pelo menos 8 caracteres.','error');return;}
 if(a!==b){message('passwordMessage','As senhas não conferem.','error');return;}
 const {error}=await supabase.auth.updateUser({password:a});
 if(error){message('passwordMessage','Não foi possível salvar a senha: '+error.message,'error');return;}
 message('passwordMessage','Senha criada com sucesso. Agora você já pode entrar.','success');
 await supabase.auth.signOut();$('passwordForm').reset();showLogin();
});
supabase.auth.onAuthStateChange((event,session)=>{
 if(session && (event==='PASSWORD_RECOVERY'||location.hash.includes('type=invite')||location.hash.includes('type=recovery'))){showPassword();}
});
$('logoutBtn').addEventListener('click',async()=>{await supabase.auth.signOut();showLogin()});
const {data:sessionData}=await supabase.auth.getSession();
if(sessionData.session?.user && (location.hash.includes('type=invite')||location.hash.includes('type=recovery'))) showPassword();
else if(sessionData.session?.user) await startSession(sessionData.session.user); else showLogin();
</script>
