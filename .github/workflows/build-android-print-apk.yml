name: Build Android printing APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - atualizacao/fila-impressao-ptbr-v0-2
      - feature/controle-impressao-seguro
    paths:
      - "app-impressao-android/**"
      - ".github/workflows/build-android-print-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "app-impressao-android/**"
      - ".github/workflows/build-android-print-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle -p app-impressao-android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sabor-do-chef-impressao-v0.2.0
          path: app-impressao-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
