<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sabor do Chef | QR Code do salão</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f4f5f7;margin:0;color:#252832}header{background:#a90f19;color:white;padding:18px;text-align:center}main{max-width:900px;margin:20px auto;padding:0 14px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.qr{background:white;border:1px solid #e2e4e9;border-radius:14px;padding:18px;text-align:center;break-inside:avoid}.qr img{width:190px;height:190px;max-width:100%}.qr h2{margin:0}.muted{font-size:12px;color:#68707d;overflow-wrap:anywhere}button{border:0;border-radius:9px;padding:11px 16px;font-weight:800;background:#b5121b;color:white}.hidden{display:none!important}@media print{body{background:white}header,.toolbar,.muted.screen{display:none!important}main{margin:0;max-width:none}.grid{grid-template-columns:repeat(3,1fr);gap:8px}.qr{border:1px dashed #888;border-radius:0;padding:10px}.qr img{width:150px;height:150px}}
</style></head><body><header><h1>Sabor do Chef</h1><div>QR Codes · Salão</div></header><main><div class="toolbar"><div><h2>QR Code das 10 mesas</h2><p class="muted screen">Acesso administrativo necessário. Imprima e fixe cada código na mesa correspondente.</p></div><button id="print" class="hidden">Imprimir QR Codes</button></div><p id="message">Validando acesso...</p><div id="grid" class="grid"></div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://enakuleybfvzqurrttwl.supabase.co','sb_publishable_JnYedcVNm6Q2tao49qaYzQ_qxjelyqA');
const $=id=>document.getElementById(id);
async function init(){
 const {data:s}=await db.auth.getSession();if(!s.session){$('message').textContent='Entre com sua conta de administrador no portal primeiro.';return;}
 const {data:role,error:re}=await db.rpc('get_my_access_role');if(re||role!=='ADMIN'){$('message').textContent='Acesso restrito ao administrador.';return;}
 const {data:tables,error}=await db.from('restaurant_tables').select('id,table_number,qr_token,active').order('table_number');
 if(error){$('message').textContent=error.message;return;}
 const base=new URL('./pedido-salao.html',location.href);
 $('grid').innerHTML=(tables||[]).map(t=>{
  const url=new URL(base);url.searchParams.set('mesa',t.qr_token);
  const img='https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data='+encodeURIComponent(url.toString());
  return '<article class="qr"><h2>Mesa '+t.table_number+'</h2><img loading="lazy" alt="QR Code da mesa '+t.table_number+'" src="'+img+'"><p class="muted">'+(t.active?'Ativa':'Desativada')+'</p></article>';
 }).join('');
 $('message').textContent='QR Codes carregados: '+tables.length+' mesas.';
 $('print').classList.remove('hidden');$('print').addEventListener('click',()=>window.print());
}
init();
</script></main></body></html>
